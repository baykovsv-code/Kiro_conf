<!doctype html>
<meta charset="utf-8">
<title>Responsive check harness</title>
<iframe id="page" src="index.html" style="display:block;width:100%;height:2000px;border:0"></iframe>
<script>
  const frame = document.getElementById('page');
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    const root = doc.documentElement;
    const body = doc.body;
    const elements = [...doc.querySelectorAll('*')];
    const maxRight = Math.max(...elements.map((element) => element.getBoundingClientRect().right));
    const cards = [...doc.querySelectorAll('.project-card')].map((card) => {
      const rect = card.getBoundingClientRect();
      return { x: Math.round(rect.x), width: Math.round(rect.width), height: Math.round(rect.height) };
    });
    document.body.textContent = JSON.stringify({
      viewport: root.clientWidth,
      rootScrollWidth: root.scrollWidth,
      bodyScrollWidth: body.scrollWidth,
      maxElementRight: Math.round(maxRight),
      overflow: root.scrollWidth > root.clientWidth || body.scrollWidth > root.clientWidth || maxRight > root.clientWidth + 1,
      cards,
      h1FontSize: getComputedStyle(doc.querySelector('h1')).fontSize,
      roleFontSize: getComputedStyle(doc.querySelector('.role')).fontSize,
      projectFontSize: getComputedStyle(doc.querySelector('.project-card p')).fontSize
    }, null, 2);
  });
</script>
